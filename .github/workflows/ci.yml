name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The conformance kit is the load-bearing artifact of this repo: its own
      # tests must pass, and it must still discriminate a conforming tool from a
      # violating one (sample-good PASS, every sample-bad FAIL with its rule named).
      - name: Conformance kit self-tests
        run: >-
          uv run --with pytest --with-requirements conformance/run.py
          pytest conformance/tests/ -q

      - name: Site metadata and renderer tests
        run: >-
          uv run --with pytest --with-requirements site/requirements.txt
          pytest site/tests/ -q

      - name: Site filter tests
        run: node --test site/tests/test_filters.cjs
