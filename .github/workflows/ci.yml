name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The conformance kit is the load-bearing artifact of this repo: its own
      # tests must pass, and it must still discriminate a conforming tool from a
      # violating one (sample-good PASS, every sample-bad FAIL with its rule named).
      - name: Conformance kit self-tests
        run: >-
          uv run --with pytest --with-requirements conformance/run.py
          pytest conformance/tests/ -q
